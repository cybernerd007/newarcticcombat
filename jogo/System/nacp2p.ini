; nacp2p.dll - P2P direto da partida (sem relay pela VPS). Fica na pasta System do jogo.
[P2P]
; 1 = ligado. 0 = desligado (o jogo volta ao fluxo antigo, com relay).
Ativo=1
; endereco UDP de sinalizacao do Canal (VPS)
Canal=104.234.63.131:56007
; 1 = usa IPv6 quando os dois jogadores tem (atravessa CGNAT). 0 = so IPv4.
IPv6=1
; 1 = grava o nacp2p.log (pasta System). 0 = sem log.
Log=1
; avancado (deixe vazio): forcar IP de LAN / IPv6 anunciados
LAN=
IPv6Endereco=
